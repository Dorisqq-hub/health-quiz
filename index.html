, {"title": "認識當季蔬果", "rows": [{"term": "春", "detail": "草莓、紅蘿蔔、玉米", "tip": ""}, {"term": "夏", "detail": "西瓜、芒果、苦瓜", "tip": ""}, {"term": "秋", "detail": "柚子、芋頭、南瓜", "tip": ""}, {"term": "冬", "detail": "柳橙、高麗菜、白蘿蔔", "tip": ""}]}, {"title": "比較鮮乳、調味乳與烹調方式", "rows": [{"term": "鮮乳", "detail": "留意鮮乳標章、品名", "tip": ""}, {"term": "調味乳", "detail": "可能含添加糖，不能只看外觀", "tip": "比較成分及營養標示"}, {"term": "清蒸、水煮、水炒", "detail": "一般較容易控制用油量", "tip": ""}, {"term": "油炸、油煎", "detail": "較可能增加用油量", "tip": "不要每天大量吃"}, {"term": "食品保存", "detail": "生熟食分開處理，冷藏食品依標示保存", "tip": ""}]}], "memory": "標章、日期、包裝、保存都要看；選新鮮與當季；讀營養標示；少油烹調。"}};
const KEYS=Object.keys(DATA);const state={lesson:null,view:'home',answers:{},submitted:{}};
function load(){try{const v=JSON.parse(localStorage.getItem('health-unit-1-v2'));if(v&&v.answers){state.answers=v.answers;state.submitted=v.submitted||{}}}catch(e){}}load();
function persist(){try{localStorage.setItem('health-unit-1-v2',JSON.stringify({answers:state.answers,submitted:state.submitted}))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const E=()=>document.getElementById('main');const k=()=>String(state.lesson);const l=()=>DATA[k()];
function questions(){return [...l().tf.map(x=>({...x,kind:'tf'})),...l().mc.map(x=>({...x,kind:'mc'}))]}
function setPage(id,view){state.lesson=id;state.view=view;render();window.scrollTo({top:0,behavior:'smooth'})}
function renderTabs(){document.getElementById('tabs').innerHTML=`<button class="${state.view==='home'?'active':''}" onclick="setPage(null,'home')">🏠 首頁</button>`+KEYS.map(i=>`<button class="${k()===i?'active':''}" onclick="setPage('${i}','note')">第${i}課｜${esc(DATA[i].title)}</button>`).join('')}
function renderHome(){let h=`<section class="panel"><h2 class="heading">選一課開始學習 ✨</h2><p class="desc">先讀筆記、背口訣，再寫考卷。選答案會自動保留在這台裝置上；交卷後才會揭曉答案。</p><div class="lesson-pick">`;KEYS.forEach(i=>{let count=Object.keys(state.answers[i]||{}).length,total=DATA[i].tf.length+DATA[i].mc.length;h+=`<button class="tile" onclick="setPage('${i}','note')"><strong>📚 第${i}課</strong><strong>${esc(DATA[i].title)}</strong><span>${count}/${total} 題已作答　${state.submitted[i]?'✅ 已交卷':''}</span></button>`});E().innerHTML=h+'</div><div class="tip">💡 家長提醒：先讓孩子獨立完成，按「交卷批改」後才會看到正確答案。</div></section>'}
function renderNote(){let h=`<section class="panel"><h2 class="heading">📖 第${k()}課・${esc(l().title)}</h2><p class="desc">${esc(l().hint)}</p><div class="actions"><button class="primary" onclick="setPage('${k()}','quiz')">✏️ 開始作答（${questions().length} 題）</button><button class="secondary" onclick="window.print()">🖨️ 列印這頁</button></div>`;l().notes.forEach((s,i)=>{h+=`<section class="section"><h3>${i+1}｜${esc(s.title)}</h3><div class="tablewrap"><table><thead><tr><th>必背名稱</th><th>解釋／例子</th><th>功能／記憶提示</th></tr></thead><tbody>`+s.rows.map(r=>`<tr><td>${esc(r.term)}</td><td>${esc(r.detail)}</td><td>${esc(r.tip)}</td></tr>`).join('')+`</tbody></table></div></section>`});h+=`<div class="memory">⭐ 考前 30 秒速背：${esc(l().memory)}</div><div class="actions"><button class="primary" onclick="setPage('${k()}','quiz')">我背好了，來考試！ 🎯</button></div></section>`;E().innerHTML=h}
function choose(index,answer){if(state.submitted[k()])return;state.answers[k()]??={};state.answers[k()][index]=answer;persist();renderQuiz(false)}
function submitQuiz(){const all=questions(),answers=state.answers[k()]||{},n=Object.keys(answers).length;if(n<all.length&&!confirm(`還有 ${all.length-n} 題未作答，空白題會算錯。確定交卷嗎？`))return;state.submitted[k()]=true;persist();renderQuiz(true);window.scrollTo({top:0,behavior:'smooth'})}
function resetQuiz(){if(!confirm('確定要清除這一課所有作答紀錄，重新測驗嗎？'))return;delete state.answers[k()];delete state.submitted[k()];persist();renderQuiz(true)}
function renderQuiz(scroll){let all=questions(),answers=state.answers[k()]||{},done=!!state.submitted[k()],n=Object.keys(answers).length,correct=all.filter((q,i)=>answers[i]===q.answer).length;let h=`<section class="panel"><h2 class="heading">✏️ 第${k()}課・${esc(l().title)}</h2><p class="desc">共 ${all.length} 題：是非題 ${l().tf.length} 題、選擇題 ${l().mc.length} 題。每題 ${100/all.length} 分。</p><div class="actions"><button class="secondary" onclick="setPage('${k()}','note')">📖 回重點筆記</button><button class="warn" onclick="resetQuiz()">🔄 重新測驗</button></div><div class="stats"><div class="stat">已作答<strong>${n}/${all.length}</strong></div><div class="stat">進度<strong>${Math.round(n/all.length*100)}%</strong></div><div class="stat">${done?'得分':'狀態'}<strong>${done?Math.round(correct/all.length*100)+' 分':'作答中'}</strong></div></div><div class="progress"><div class="bar" style="width:${n/all.length*100}%"></div></div>`;
all.forEach((q,i)=>{let isTF=q.kind==='tf',idx=isTF?i+1:i+1-l().tf.length,options=isTF?[['O','⭕ 正確'],['X','❌ 錯誤']]:q.options.map((o,j)=>[String.fromCharCode(65+j),String.fromCharCode(65+j)+'．'+o]);let a=answers[i];h+=`<div class="qcard ${done?(a===q.answer?'ok':'bad'):''}"><p class="qtitle">${isTF?'是非題':'選擇題'} ${idx}. ${esc(q.q)}</p><div class="options">`;options.forEach(([key,label])=>{let cls=a===key?'selected':'';if(done&&key===q.answer)cls+=' ok';h+=`<button type="button" class="opt ${cls}" ${done?'disabled':''} onclick="choose(${i},'${key}')"><strong>${isTF?key:key}</strong><span>${esc(label)}</span></button>`});h+='</div>';if(done){h+=`<div class="feedback">${a===q.answer?'✅ 答對了！':'❗ 答錯了'+(a?'':'（未作答）')}　正確答案：<b>${q.answer==='O'?'○':q.answer==='X'?'×':q.answer}</b><div class="small">${esc(q.explain)}</div></div>`}h+='</div>'});h+=`<div class="dock"><span class="badge">${done?'🏆 已完成':'📝 已作答 '+n+'/'+all.length}</span>${done?`<button class="secondary" onclick="setPage('${k()}','note')">回筆記複習</button><button class="warn" onclick="resetQuiz()">再測一次</button>`:`<button class="primary" onclick="submitQuiz()">✅ 交卷・自動批改</button>`}</div></section>`;E().innerHTML=h;if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function render(){renderTabs();if(state.view==='home')renderHome();else if(state.view==='note')renderNote();else renderQuiz(false)}render();
